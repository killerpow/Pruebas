<!DOCTYPE html>
<html lang="es">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap');
        
        body { 
            font-family: 'Inter', sans-serif; 
            transition: background-color 0.4s ease;
            -webkit-tap-highlight-color: transparent;
            color: #f8fafc;
            background-color: #0f172a;

            overflow-x: hidden;

</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        const SVGIcon = ({ name, color = "currentColor", size = 24 }) => {
            const icons = {
                hammer: <g><path d="m15 5 4 4-11 11-4-4L15 5Z"/><path d="m21 2-5 5"/><path d="m17 2 5 5"/><path d="m7 12-5 5"/><path d="m2 17 5 5"/></g>,
                banknote: <g><rect width="20" height="12" x="2" y="6" rx="2"/><circle cx="12" cy="12" r="2"/><path d="M6 12h.01M18 12h.01"/></g>,
                userPlus: <g><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" x2="19" y1="8" y2="14"/><line x1="16" x2="22" y1="11" y2="11"/></g>,
                clock: <g><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></g>,
                check: <polyline points="20 6 9 17 4 12"/>,
                archive: <g><rect width="20" height="5" x="2" y="3" rx="1"/><path d="M4 8v11a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8"/><path d="M10 12h4"/></g>,
                chart: <g><path d="M21.21 15.89A10 10 0 1 1 8 2.83"/><path d="M22 12A10 10 0 0 0 12 2v10z"/></g>,
                save: <g><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></g>,
                trash: <g><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></g>,
                package: <g><path d="M16.5 9.4 7.5 4.21"/><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.29 7 12 12 20.71 7"/><line x1="12" x2="12" y1="22" y2="12"/></g>,
                whatsapp: <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.414 0 .015 5.398.012 12.037c0 2.12.553 4.189 1.604 6.04L0 24l6.117-1.605a11.837 11.837 0 005.928 1.573h.006c6.635 0 12.032-5.398 12.035-12.041a11.85 11.85 0 00-3.483-8.511z"/>,
                undo: <g><path d="M9 14 4 9l5-5"/><path d="M4 9h12a5 5 0 0 1 0 10H7"/></g>,
                download: <g><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></g>,
                shield: <g><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></g>,
                upload: <g><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></g>,
                file: <g><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/></g>,
                messageSquare: <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>,
                edit: <g><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></g>,
                users: <g><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></g>
            };

            return (
                <svg width={size} height={size} viewBox="0 0 24 24" fill={name === "whatsapp" ? "currentColor" : "none"} stroke={name === "whatsapp" ? "none" : color} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                    {icons[name] || null}
                </svg>
            );
        };

        const App = () => {
            const [tasks, setTasks] = useState([]);
            const [expenses, setExpenses] = useState([]);
            const [view, setView] = useState('pending');
            const [showForm, setShowForm] = useState(false);
            const [editingId, setEditingId] = useState(null); 
            const [showExpenseForm, setShowExpenseForm] = useState(false);
            const [alertMsg, setAlertMsg] = useState(null);
            const [editMoney, setEditMoney] = useState(null); 
            const [editCobrado, setEditCobrado] = useState(null);
            const [restoreCode, setRestoreCode] = useState('');
            
            const [formData, setFormData] = useState({
                clientName: '', phone: '', address: '', jobType: '', notes: '', materials: '', totalAmount: '', paidAmount: ''
            });

            const [expenseData, setExpenseData] = useState({ concept: '', amount: '' });

            useEffect(() => {
                const loadData = () => {
                    try {
                        const t = localStorage.getItem('pro_tasks_v13');
                        const e = localStorage.getItem('pro_expenses_v13');
                        if(t) setTasks(JSON.parse(t));
                        if(e) setExpenses(JSON.parse(e));
                    } catch (err) { console.error(err); }
                };
                loadData();
            }, []);

            useEffect(() => {
                localStorage.setItem('pro_tasks_v13', JSON.stringify(tasks));
                localStorage.setItem('pro_expenses_v13', JSON.stringify(expenses));
            }, [tasks, expenses]);

            const showAlert = (msg) => {
                setAlertMsg(msg);
                setTimeout(() => setAlertMsg(null), 3000);
            };

            const cleanMaterials = (text) => {
                if (!text || typeof text !== 'string') return [];
                return text.split(/[,\.\;\n]/).map(m => m.trim()).filter(m => m.length > 0);
            };

            const handleInputChange = (field, value) => {
                setFormData({ ...formData, [field]: value.toUpperCase() });
            };

            // SOLUCIÓN PARA WHATSAPP: Abrir en la capa superior (_top) para evitar bloqueos en el visor
            const openWhatsApp = (url) => {
                window.open(url, '_top');
            };

            const handleSaveTask = (e) => {
                e.preventDefault();
                const finalData = { ...formData, totalAmount: formData.totalAmount || '0', paidAmount: formData.paidAmount || '0' };
                
                if (editingId) {
                    setTasks(tasks.map(t => t.id === editingId ? { ...finalData, id: editingId, status: t.status } : t));
                    showAlert("✅ TRABAJO ACTUALIZADO");
                } else {
                    setTasks([{ ...finalData, id: Date.now(), status: 'pending' }, ...tasks]);
                    showAlert("✅ TRABAJO GUARDADO");
                }
                
                setShowForm(false);
                setEditingId(null);
                setFormData({ clientName: '', phone: '', address: '', jobType: '', notes: '', materials: '', totalAmount: '', paidAmount: '' });
            };

            const handleEditTask = (task) => {
                setFormData({
                    clientName: task.clientName || '',
                    phone: task.phone || '',
                    address: task.address || '',
                    jobType: task.jobType || '',
                    notes: task.notes || '',
                    materials: task.materials || '',
                    totalAmount: task.totalAmount || '0',
                    paidAmount: task.paidAmount || '0'
                });
                setEditingId(task.id);
                setShowForm(true);
            };

            const handleArchivar = (task) => {
                const deuda = (parseFloat(task.totalAmount) || 0) - (parseFloat(task.paidAmount) || 0);
                if (deuda > 0) {
                    showAlert(`⚠️ NO SE PUEDE ARCHIVAR: DEBE ${deuda.toFixed(2)}€`);
                    return;
                }
                setTasks(tasks.map(t => t.id === task.id ? { ...t, status: 'archived' } : t));
                showAlert("✅ TRABAJO ARCHIVADO");
            };

            const downloadBackup = () => {
                const data = JSON.stringify({tasks, expenses});
                const blob = new Blob([data], {type: 'application/json'});
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `backup_jumianje_${new Date().toLocaleDateString()}.json`;
                a.click();
            };

            const sendWhatsAppBackup = () => {
                const data = JSON.stringify({tasks, expenses});
                const msg = encodeURIComponent("BACKUP FONTANERIA JUMIANJE:\n\n" + data);
                openWhatsApp(`https://api.whatsapp.com/send?text=${msg}`);
            };

            const sendPendingListWhatsApp = () => {
                const pendingTasks = tasks.filter(t => t.status === 'pending');
                if (pendingTasks.length === 0) {
                    showAlert("⚠️ NO HAY TRABAJOS EN ESPERA");
                    return;
                }

                let text = `🛠️ *FONTANERIA JUMIANJE* 🛠️\n`;
                text += `━━━━━━━━━━━━━━\n`;
                text += `📋 *TRABAJOS PENDIENTES*\n\n`;

                pendingTasks.forEach((t, i) => {
                    text += `📌 *${i+1}. ${t.clientName}*\n`;
                    if (t.phone) text += `📞 ${t.phone}\n`;
                    if (t.address) text += `🏠 ${t.address}\n`;
                    if (t.jobType) text += `🛠️ ${t.jobType}\n`;
                    
                    if (t.materials) {
                        const mList = cleanMaterials(t.materials);
                        if (mList.length > 0) {
                            text += `📦 *Materiales:*\n`;
                            mList.forEach(m => { text += `   - ${m}\n`; });
                        }
                    }
                    text += `──────────────────\n\n`;
                });

                text += `⚡ _Generado por Gestor JUMIANJE_`;
                const msg = encodeURIComponent(text);
                openWhatsApp(`https://api.whatsapp.com/send?text=${msg}`);
            };

            const handleRestore = () => {
                try {
                    const parsed = JSON.parse(restoreCode);
                    if(parsed.tasks) setTasks(parsed.tasks);
                    if(parsed.expenses) setExpenses(parsed.expenses);
                    showAlert("✅ DATOS RESTAURADOS CORRECTAMENTE");
                    setRestoreCode('');
                } catch(e) {
                    showAlert("❌ CÓDIGO NO VÁLIDO");
                }
            };

            const totals = useMemo(() => {
                const inVal = tasks.reduce((acc, t) => acc + (parseFloat(t.paidAmount) || 0), 0);
                const paidExpensesVal = expenses.reduce((acc, e) => acc + (e.isPaid ? (parseFloat(e.amount) || 0) : 0), 0);
                const pendingExpensesVal = expenses.reduce((acc, e) => acc + (!e.isPaid ? (parseFloat(e.amount) || 0) : 0), 0);
                
                const pendingVal = tasks.reduce((acc, t) => {
                    const diff = (parseFloat(t.totalAmount) || 0) - (parseFloat(t.paidAmount) || 0);
                    return acc + (diff > 0 ? diff : 0);
                }, 0);
                
                const potentialIn = tasks.reduce((acc, t) => acc + (parseFloat(t.totalAmount) || 0), 0);
                const totalOutReal = expenses.reduce((acc, e) => acc + (parseFloat(e.amount) || 0), 0);

                return { 
                    in: inVal, 
                    out: paidExpensesVal, 
                    bal: inVal - paidExpensesVal, 
                    pending: pendingVal, 
                    potential: potentialIn - totalOutReal,
                    pendingExpenses: pendingExpensesVal
                };
            }, [tasks, expenses]);

            const handlePayExpense = (id) => {
                setExpenses(expenses.map(e => e.id === id ? { ...e, isPaid: true } : e));
                showAlert("✅ GASTO LIQUIDADO");
            };

            const handleRepartirYLiquidar = () => {
                const confirmacion = confirm(`⚠️ ¿ESTÁS SEGURO DE LIQUIDAR TODO?\n\nSe pondrán a cero los cobros y gastos registrados.\n\nReparto actual: ${(totals.bal / 2).toFixed(2)}€ para cada uno.`);
                
                if (confirmacion) {
                    setTasks(tasks.map(t => ({ ...t, paidAmount: '0', totalAmount: t.status === 'archived' ? '0' : t.totalAmount })));
                    setExpenses([]);
                    showAlert("✅ BALANCE LIQUIDADO A CERO");
                }
            };

            const pendingCount = tasks.filter(t => t.status === 'pending').length;

            return (
                <div className="min-h-screen flex flex-col pb-20 max-w-md mx-auto relative">
                    {alertMsg && (
                        <div className="fixed top-4 left-4 right-4 z-[300] bg-blue-600 text-white p-4 rounded-2xl font-black text-center shadow-2xl">
                            {alertMsg}
                        </div>
                    )}

                    <header className="bg-slate-900/80 backdrop-blur-md p-6 sticky top-0 z-50 flex justify-between items-center border-b border-white/5">
                        <div className="flex items-center gap-3">
                            <SVGIcon name="hammer" color="#3b82f6" size={28} />
                            <div className="flex flex-col">
                                <h1 className="font-black text-xl italic uppercase text-white tracking-tighter leading-none">FONTANERIA</h1>
                                <h1 className="font-black text-xl italic uppercase text-blue-400 tracking-tighter leading-none">JUMIANJE</h1>
                            </div>
                            <button onClick={sendPendingListWhatsApp} className="wa-header-btn btn-press ml-2">
                                <SVGIcon name="whatsapp" color="white" size={22} />
                                {pendingCount > 0 && <div className="wa-header-badge">{pendingCount}</div>}
                            </button>
                        </div>
                        <div className="flex gap-4">
                            <button onClick={() => setShowExpenseForm(true)} className="btn-press">
                                <SVGIcon name="banknote" color="#ef4444" size={28} />
                            </button>
                            <button onClick={() => { setEditingId(null); setFormData({clientName:'', phone:'', address:'', jobType:'', notes:'', materials:'', totalAmount:'', paidAmount:''}); setShowForm(true); }} className="btn-press">
                                <SVGIcon name="userPlus" color="#22c55e" size={28} />
                            </button>
                        </div>
                    </header>

                    <nav className="bg-slate-900/90 border-b border-white/5 sticky top-[85px] z-40 p-2 flex gap-1">
                        {[
                            {id:'pending', icon:'clock', label:'Espera', hex: '#60a5fa'}, 
                            {id:'completed', icon:'check', label:'Hechos', hex: '#4ade80'}, 
                            {id:'archived', icon:'archive', label:'Archivo', hex: '#94a3b8'}, 
                            {id:'balance', icon:'chart', label:'Balance', hex: '#c084fc'}, 
                            {id:'backups', icon:'save', label:'Copias', hex: '#fb923c'}
                        ].map(tab => (
                            <button key={tab.id} onClick={() => setView(tab.id)} className={`flex-1 py-2 flex flex-col items-center gap-1 transition-all ${view === tab.id ? 'tab-active opacity-100' : 'opacity-40'}`}>
                                <SVGIcon name={tab.icon} size={20} color={tab.hex} />
                                <span className={`text-[10px] font-black uppercase`} style={{color: tab.hex}}>{tab.label}</span>
                            </button>
                        ))}
                    </nav>

                    <main className="flex-1 p-4">
                        {view === 'backups' ? (
                            <div className="space-y-6">
                                <div className="copy-section-card space-y-4">
                                    <h3 className="text-sm font-black uppercase text-white">COMPARTIR TODO</h3>
                                    <button onClick={sendWhatsAppBackup} className="w-full bg-[#2e7d32] hover:bg-green-700 p-5 rounded-2xl flex items-center justify-center gap-3 transition-colors btn-press">
                                        <SVGIcon name="messageSquare" size={22} color="white" />
                                        <span className="font-black text-[12px] text-white">ENVIAR JSON POR WHATSAPP</span>
                                    </button>
                                    
                                    <div className="grid grid-cols-2 gap-3">
                                        <button onClick={downloadBackup} className="bg-blue-700 p-5 rounded-[1.5rem] flex flex-col items-center gap-2 btn-press">
                                            <SVGIcon name="download" size={24} color="white" />
                                            <span className="text-[9px] font-black uppercase text-white">DESCARGAR ARCHIVO</span>
                                        </button>
                                        <button onClick={() => showAlert("SISTEMA ACTUALIZADO")} className="bg-[#2c3444] p-5 rounded-[1.5rem] flex flex-col items-center gap-2 btn-press">
                                            <SVGIcon name="shield" size={24} color="#94a3b8" />
                                            <span className="text-[9px] font-black uppercase text-white">ESTADO SEGURO</span>
                                        </button>
                                    </div>
                                </div>

                                <div className="copy-section-card space-y-6">
                                    <h3 className="text-lg font-black uppercase text-white">RESTAURAR</h3>
                                    <div className="dotted-upload" onClick={() => document.getElementById('fileInput').click()}>
                                        <SVGIcon name="file" size={32} color="#3b82f6" />
                                        <span className="text-[10px] font-black uppercase text-slate-400">ELEGIR ARCHIVO .JSON</span>
                                        <input type="file" id="fileInput" className="hidden" onChange={(e) => {
                                            const file = e.target.files[0];
                                            if (file) {
                                                const reader = new FileReader();
                                                reader.onload = (e) => setRestoreCode(e.target.result);
                                                reader.readAsText(file);
                                            }
                                        }} />
                                    </div>
                                    <div className="space-y-4">
                                        <div className="bg-[#121212] rounded-3xl p-4 border border-white/5">
                                            <textarea className="w-full h-32 bg-transparent border-none text-xs text-slate-400 no-scrollbar" placeholder="Pegar código de backup aquí..." value={restoreCode} onChange={(e) => setRestoreCode(e.target.value)} />
                                        </div>
                                        <button onClick={handleRestore} className="w-full bg-blue-700 py-5 rounded-[1.5rem] font-black text-xs uppercase tracking-wider btn-press">RESTAURAR AHORA</button>
                                    </div>
                                </div>
                            </div>
                        ) : view === 'balance' ? (
                            <div className="space-y-4">
                                <div className="grid grid-cols-2 gap-3">
                                    <div className="bg-white/5 p-4 rounded-2xl text-center">
                                        <p className="text-[9px] font-black text-slate-500 uppercase mb-1">Total Cobrado</p>
                                        <h2 className="text-xl font-black text-green-500">{totals.in.toFixed(2)}€</h2>
                                    </div>
                                    <div className="bg-white/5 p-4 rounded-2xl text-center">
                                        <p className="text-[9px] font-black text-slate-500 uppercase mb-1">Gastos Pagados</p>
                                        <h2 className="text-xl font-black text-red-500">{totals.out.toFixed(2)}€</h2>
                                    </div>
                                </div>
                                
                                <div className="bg-purple-600/20 p-6 rounded-[2rem] border border-purple-500/30 text-center shadow-xl">
                                    <p className="text-[10px] font-black text-purple-400 uppercase mb-1">Beneficio Neto Real</p>
                                    <h2 className="text-3xl font-black text-white">{totals.bal.toFixed(2)}€</h2>
                                </div>

                                <button onClick={handleRepartirYLiquidar} className="w-full bg-gradient-to-r from-indigo-600 to-purple-600 p-6 rounded-[2rem] shadow-xl border border-white/10 btn-press mt-2 mb-4">
                                    <div className="flex flex-col items-center gap-1">
                                        <div className="flex items-center gap-2">
                                            <SVGIcon name="users" size={24} color="white" />
                                            <span className="font-black text-xs uppercase text-white tracking-widest">Repartir y Liquidar</span>
                                        </div>
                                        <div className="mt-1 bg-black/30 px-4 py-1 rounded-full">
                                            <span className="text-[14px] font-black text-white">
                                                {totals.bal.toFixed(2)}€ / 2 = <span className="text-green-400">{(totals.bal / 2).toFixed(2)}€</span>
                                            </span>
                                        </div>
                                        <span className="text-[8px] text-indigo-200 uppercase font-bold mt-2 opacity-60">Pulsa para poner todo a cero</span>
                                    </div>
                                </button>
                                
                                <div className="grid grid-cols-2 gap-3 opacity-60">
                                    <div className="bg-white/5 p-4 rounded-2xl text-center border border-dashed border-blue-500/20">
                                        <p className="text-[9px] font-black text-slate-500 uppercase mb-1">Pte. Cobro</p>
                                        <h2 className="text-sm font-black text-blue-400">{totals.pending.toFixed(2)}€</h2>
                                    </div>
                                    <div className="bg-white/5 p-4 rounded-2xl text-center border border-dashed border-red-500/20">
                                        <p className="text-[9px] font-black text-slate-500 uppercase mb-1">Pte. Pago (Gasto)</p>
                                        <h2 className="text-sm font-black text-red-400">{totals.pendingExpenses.toFixed(2)}€</h2>
                                    </div>
                                </div>

                                <div className="mt-6 space-y-3">
                                    <div className="flex justify-between items-center px-2">
                                        <h3 className="text-xs font-black uppercase text-slate-500">Desglose de Gastos</h3>
                                    </div>
                                    <div className="space-y-2">
                                        {expenses.length === 0 ? (
                                            <p className="text-center py-6 text-[10px] text-slate-600 font-bold uppercase">Sin gastos registrados</p>
                                        ) : expenses.map(exp => (
                                            <div key={exp.id} className={`flex items-center justify-between p-4 rounded-2xl transition-all ${exp.isPaid ? 'bg-slate-800/30 opacity-40' : 'bg-red-500/10 border border-red-500/20'}`}>
                                                <div className="flex-1">
                                                    <p className="text-[10px] font-black text-white uppercase tracking-wider">{exp.concept}</p>
                                                    <div className="flex items-center gap-2">
                                                        <p className="text-lg font-black text-red-400">{exp.amount.toFixed(2)}€</p>
                                                        {exp.isPaid && <span className="bg-green-500/20 text-green-500 text-[8px] px-2 py-1 rounded font-black">PAGADO</span>}
                                                    </div>
                                                </div>
                                                <div className="flex gap-2">
                                                    {!exp.isPaid && (
                                                        <button onClick={() => handlePayExpense(exp.id)} className="bg-green-600 p-3 rounded-xl btn-press">
                                                            <SVGIcon name="check" size={18} color="white" />
                                                        </button>
                                                    )}
                                                    <button onClick={() => { if(confirm("¿Eliminar?")) setExpenses(expenses.filter(e => e.id !== exp.id)); }} className="bg-slate-800 p-3 rounded-xl btn-press">
                                                        <SVGIcon name="trash" size={18} color="#ef4444" />
                                                    </button>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        ) : (
                            <div className="space-y-4">
                                {tasks.filter(t => t.status === view).map(task => {
                                    const deuda = (parseFloat(task.totalAmount) || 0) - (parseFloat(task.paidAmount) || 0);
                                    return (
                                        <div key={task.id} className={`${view === 'pending' ? 'card-pending' : view === 'completed' ? 'card-completed' : 'card-archived'} rounded-[2rem] p-6 shadow-xl relative`}>
                                            <div className="flex justify-between items-start mb-1">
                                                <div className="flex-1">
                                                    <div className="flex items-center gap-2">
                                                        <h4 className="client-name text-lg text-white">{task.clientName}</h4>
                                                        {deuda > 0 && <span className="deuda-badge">DEBE {deuda.toFixed(0)}€</span>}
                                                    </div>
                                                    <p className="text-xs text-white/40">{task.jobType}</p>
                                                </div>
                                                <div className="flex gap-1 items-center">
                                                    <button onClick={() => handleEditTask(task)} className="btn-press p-2 hover:bg-white/10 rounded-full transition-colors">
                                                        <SVGIcon name="edit" color="#60a5fa" size={22} />
                                                    </button>
                                                    {view !== 'pending' && (
                                                        <button onClick={() => setTasks(tasks.map(t => t.id === task.id ? { ...t, status: view === 'archived' ? 'completed' : 'pending' } : t))} className="btn-press p-1">
                                                            <SVGIcon name="undo" color="#94a3b8" size={24} />
                                                        </button>
                                                    )}
                                                    {task.phone && (
                                                        <button onClick={() => {
                                                            const cleanPhone = task.phone.replace(/\D/g, '');
                                                            const fullPhone = cleanPhone.length === 9 ? `34${cleanPhone}` : cleanPhone;
                                                            const msgText = `Hola, soy de Fontanería JUMIANJE. ¿Estarás en casa para lo de ${task.jobType || 'tu avería'}? Gracias.`;
                                                            openWhatsApp(`https://api.whatsapp.com/send?phone=${fullPhone}&text=${encodeURIComponent(msgText)}`);
                                                        }} className="btn-press p-1">
                                                            <SVGIcon name="whatsapp" color="#22c55e" size={28} />
                                                        </button>
                                                    )}
                                                </div>
                                            </div>
                                            {cleanMaterials(task.materials).length > 0 && (
                                                <div className="materials-box">
                                                    {cleanMaterials(task.materials).map((m, i) => (
                                                        <div key={i} className="material-row">
                                                            <SVGIcon name="package" size={12} color="#60a5fa" />
                                                            <span className="uppercase font-bold">{m}</span>
                                                        </div>
                                                    ))}
                                                </div>
                                            )}
                                            <div className="flex gap-4 mt-4">
                                                <div className="flex-1 text-center bg-black/20 p-2 rounded-xl" onClick={() => setEditMoney({ id: task.id, type: 'totalAmount', value: task.totalAmount })}>
                                                    <p className="text-[8px] uppercase text-white/30">PVP</p>
                                                    <p className="font-bold">{task.totalAmount}€</p>
                                                </div>
                                                <div className="flex-1 text-center bg-black/20 p-2 rounded-xl" onClick={() => setEditCobrado({ id: task.id, currentPaid: task.paidAmount, totalPVP: task.totalAmount })}>
                                                    <p className="text-[8px] uppercase text-white/30">Cobrado</p>
                                                    <p className="font-bold text-green-400">{task.paidAmount}€</p>
                                                </div>
                                            </div>
                                            <div className="mt-4 flex gap-2">
                                                {view === 'pending' && <button onClick={() => setTasks(tasks.map(t=>t.id===task.id?{...t, status:'completed'}:t))} className="flex-1 bg-green-600 py-3 rounded-xl font-black text-[10px] uppercase transition-colors hover:bg-green-700">Hecho</button>}
                                                {view === 'completed' && <button onClick={() => handleArchivar(task)} className="flex-1 bg-blue-600 py-3 rounded-xl font-black text-[10px] uppercase transition-colors hover:bg-blue-700">Archivar</button>}
                                                <button onClick={() => { if(confirm("¿Eliminar?")) setTasks(tasks.filter(t=>t.id!==task.id)); }} className="p-3 bg-red-900/40 text-red-500 rounded-xl flex items-center justify-center transition-colors hover:bg-red-800/60">
                                                    <SVGIcon name="trash" size={16} color="#ef4444" />
                                                </button>
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        )}
                    </main>

                    {/* MODALES DE EDICIÓN */}
                    {editCobrado && (
                        <div className="fixed inset-0 bg-black/80 z-[300] p-6 flex items-center justify-center backdrop-blur-sm">
                            <div className="bg-slate-900 w-full max-w-xs rounded-[2rem] p-6 border border-white/10 text-center shadow-2xl">
                                <h3 className="text-xs font-black text-blue-400 uppercase mb-4">Añadir Pago</h3>
                                <div className="grid grid-cols-2 gap-2 mb-6">
                                    <div className="bg-black/20 p-3 rounded-xl">
                                        <p className="text-[8px] text-white/40 uppercase">PVP</p>
                                        <p className="text-lg font-black text-white">{editCobrado.totalPVP}€</p>
                                    </div>
                                    <div className="bg-black/20 p-3 rounded-xl">
                                        <p className="text-[8px] text-white/40 uppercase">Pagado</p>
                                        <p className="text-lg font-black text-green-500">{editCobrado.currentPaid}€</p>
                                    </div>
                                </div>
                                <div className="space-y-2 mb-6 text-left">
                                    <p className="text-[9px] uppercase text-slate-500 font-bold ml-2">¿Cuánto entrega?</p>
                                    <input type="number" autoFocus placeholder="0" onFocus={(e) => e.target.select()} className="w-full text-3xl font-black text-center p-4 rounded-xl bg-black/40" id="entregaInput" />
                                </div>
                                <div className="flex gap-2">
                                    <button onClick={() => setEditCobrado(null)} className="flex-1 py-3 text-white/40 font-bold">Cerrar</button>
                                    <button onClick={() => {
                                            const entrega = parseFloat(document.getElementById('entregaInput').value) || 0;
                                            const nuevoTotal = (parseFloat(editCobrado.currentPaid) || 0) + entrega;
                                            setTasks(tasks.map(t => t.id === editCobrado.id ? {...t, paidAmount: nuevoTotal.toString()} : t));
                                            setEditCobrado(null);
                                            showAlert(`✅ +${entrega}€ SUMADOS`);
                                        }} className="flex-1 bg-green-600 py-3 rounded-xl font-black uppercase text-xs">Ok</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {editMoney && (
                        <div className="fixed inset-0 bg-black/80 z-[300] p-6 flex items-center justify-center backdrop-blur-sm">
                            <div className="bg-slate-900 w-full max-w-xs rounded-[2rem] p-6 border border-white/10 text-center shadow-2xl">
                                <input type="number" autoFocus onFocus={(e) => e.target.select()} className="w-full text-4xl font-black text-center p-4 rounded-xl mb-4 bg-black/40" value={editMoney.value} onChange={(e) => setEditMoney({...editMoney, value: e.target.value})} />
                                <div className="flex gap-2">
                                    <button onClick={() => setEditMoney(null)} className="flex-1 py-3 text-white/40 font-bold">Cerrar</button>
                                    <button onClick={() => {
                                            setTasks(tasks.map(t => t.id === editMoney.id ? {...t, [editMoney.type]: editMoney.value} : t));
                                            setEditMoney(null);
                                        }} className="flex-1 bg-blue-600 py-3 rounded-xl font-black uppercase text-xs">Guardar</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {showForm && (
                        <div className="fixed inset-0 bg-black/90 z-[200] p-6 flex items-center justify-center backdrop-blur-md">
                            <form onSubmit={handleSaveTask} className="bg-slate-900 w-full max-w-sm rounded-[2.5rem] p-8 space-y-4 border border-white/10 shadow-2xl">
                                <h2 className="font-black uppercase text-blue-400 mb-2">{editingId ? 'Editar Cliente' : 'Nuevo Cliente'}</h2>
                                <input placeholder="Nombre Cliente" className="w-full p-4 rounded-xl" value={formData.clientName} onChange={e=>handleInputChange('clientName', e.target.value)} required />
                                <input type="tel" placeholder="Teléfono" className="w-full p-4 rounded-xl" value={formData.phone} onChange={e=>handleInputChange('phone', e.target.value)} />
                                <input placeholder="¿Qué tarea?" className="w-full p-4 rounded-xl" value={formData.jobType} onChange={e=>handleInputChange('jobType', e.target.value)} />
                                <textarea placeholder="Materiales o Notas..." className="w-full p-4 rounded-xl h-20" value={formData.materials} onChange={e=>handleInputChange('materials', e.target.value)} />
                                <div className="flex gap-4">
                                    <div className="flex-1">
                                        <p className="text-[9px] uppercase text-slate-500 mb-1 ml-2 font-bold">Total PVP</p>
                                        <input placeholder="0" className="w-full p-4 rounded-xl text-center" value={formData.totalAmount} onFocus={(e) => e.target.select()} onChange={e=>setFormData({...formData, totalAmount:e.target.value})} />
                                    </div>
                                    <div className="flex-1">
                                        <p className="text-[9px] uppercase text-slate-500 mb-1 ml-2 font-bold">Cobrado</p>
                                        <input placeholder="0" className="w-full p-4 rounded-xl text-center" value={formData.paidAmount} onFocus={(e) => e.target.select()} onChange={e=>setFormData({...formData, paidAmount:e.target.value})} />
                                    </div>
                                </div>
                                <div className="flex gap-2 mt-4">
                                    <button type="button" onClick={()=>{setShowForm(false); setEditingId(null);}} className="flex-1 bg-slate-800 p-4 rounded-xl font-bold uppercase text-xs">Cancelar</button>
                                    <button type="submit" className="flex-1 bg-blue-600 p-4 rounded-xl font-black uppercase text-xs">{editingId ? 'ACTUALIZAR' : 'CREAR'}</button>
                                </div>
                            </form>
                        </div>
                    )}

                    {showExpenseForm && (
                        <div className="fixed inset-0 bg-black/90 z-[200] p-6 flex items-center justify-center backdrop-blur-md">
                            <div className="bg-slate-900 w-full max-w-sm rounded-[2.5rem] p-8 space-y-4 border border-white/10 text-center shadow-2xl">
                                <h3 className="font-black text-red-500 uppercase">Nuevo Gasto</h3>
                                <input placeholder="¿En qué?" className="w-full p-4 rounded-xl" value={expenseData.concept} onChange={e=>setExpenseData({...expenseData, concept:e.target.value.toUpperCase()})} />
                                <input placeholder="Importe €" className="w-full p-4 rounded-xl text-center text-2xl font-black" value={expenseData.amount} onFocus={(e) => e.target.select()} onChange={e=>setExpenseData({...expenseData, amount:e.target.value})} />
                                <button onClick={()=>{
                                    if(!expenseData.amount) return;
                                    setExpenses([{...expenseData, id:Date.now(), amount: parseFloat(expenseData.amount), isPaid: false}, ...expenses]);
                                    setShowExpenseForm(false);
                                    setExpenseData({concept:'', amount:''});
                                    showAlert("✅ GASTO REGISTRADO");
                                }} className="w-full bg-red-600 p-4 rounded-xl font-black uppercase text-xs">REGISTRAR GASTO</button>
                                <button onClick={()=>setShowExpenseForm(false)} className="text-white/40 text-[10px] font-black uppercase p-2">Cerrar</button>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
